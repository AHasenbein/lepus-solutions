name: Feature request
description: Suggest a feature or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: lens
    attributes:
      label: Who is this for?
      options:
        - Planner
        - Budget Office
        - Community Advocate
        - Contributors / developers
        - Everyone
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision is hard to make today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data needed (with links)
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
